management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: true
    sampling:
      probability: ${SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.security.autoconfigure.servlet.ManagementWebSecurityAutoConfiguration
  application:
    name: ArchForge
    version: 1.0.0
  messages:
    basename: i18n/messages
    encoding: UTF-8
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
  datasource:
    dynamic:
      primary: user_master
      strict: false
      druid:
        initial-size: 0
        max-active: 5
        min-idle: 1
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        stat:
          merge-sql: true
          slow-sql-millis: 500
          log-slow-sql: true
  mvc:
    problemdetails:
      enabled: true
  sql:
    init:
      encoding: UTF-8
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      fail-on-empty-beans: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    locale: zh_CN
    default-property-inclusion: non_null
  modulith:
    detection-strategy: explicitly-annotated

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-request-duration: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: false
  pre-loading-enabled: true
  writer-with-default-pretty-printer: true

# 项目相关配置
arch-forge:
  name: ArchForge
  version: 1.0.0
  copyright-year: 2025
  captcha-type: math
  sensitive:
    enabled: true
  rsa-private-key: ${ARCH_FORGE_RSA_PRIVATE_KEY:}
  scheduler:
    # db-scheduler runtime（调度状态存 scheduled_tasks 表，反射调用仅允许此名单内的 bean）
    allowed-job-beans: demoSchedulerJob
    threads: 5
  meta-table:
    max-page-size: 200
  codegen:
    workspace-root: ${ARCH_FORGE_CODEGEN_WORKSPACE_ROOT:${user.home}/.archforge/codegen}
  token:
    header: Authorization
    auto-refresh-time: 20
  llm:
    provider: ${LLM_PROVIDER:openai}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
    anthropic-version: ${LLM_ANTHROPIC_VERSION:2023-06-01}
  file-storage:
    type: local
    local-dir: uploads
    max-file-size: 10485760
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - bmp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - csv
      - zip
      - rar
      - 7z
      - mp3
      - mp4
      - avi
      - mov
      - json
      - xml
    blocked-mime-types:
      - application/x-msdownload
      - application/x-sh
      - application/x-executable
      - application/x-ms-installer
      - application/x-bat
      - application/javascript
    s3:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: archforge
      region: us-east-1

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-cookie: false
  token-style: uuid
  is-log: false
  is-print: false
