  /admin/user:
    post:
      tags: [admin]
      summary: Admin user page
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"
  /admin/user/create:
    post:
      tags: [admin]
      summary: Create admin user
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"
  /admin/user/update:
