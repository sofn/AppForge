openapi: 3.1.0
info:
  title: ArchForge API
  version: 0.1.0
  summary: Stub contract for ArchForge admin and C-end APIs.
  description: |
    Two servers, two clients:

    - **Admin** (`server-admin`, port 8080) — consumed by ArchForgeAdmin.
      Success envelope `{code, message, data}`. See `specs/api-response.md`.
    - **Web** (`server-web`, port 8081) — consumed by ArchForgeWeb.
      Errors use RFC 9457 ProblemDetail.

    This file is a **stub**. Paths listed here are the live surface we are
    willing to document. Do **not** reintroduce deleted `/system/menu` or
    `/system/role`. Leftover `/system/dict` is a migration backlog item
    (see `specs/api-path.md`), not a target prefix.

    When an endpoint changes, update this file in the same change.

servers:
  - url: http://localhost:8080
    description: server-admin (ArchForgeAdmin)
  - url: http://localhost:8081
    description: server-web (ArchForgeWeb)

tags:
  - name: admin-auth
    description: Admin sa-token login on server-admin
  - name: admin
    description: Admin resources under /admin/*
  - name: admin-legacy
    description: Admin paths still missing the /admin prefix
  - name: web
    description: C-end resources under /web/* on server-web

security:
  - saToken: []

paths:
  /auth/login:
    post:
      tags: [admin-auth]
      summary: Admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Wrapped login payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /auth/logout:
    post:
      tags: [admin-auth]
      summary: Admin logout
      responses:
        "200":
          description: Wrapped boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /auth/refresh-token:
    post:
      tags: [admin-auth]
      summary: Refresh admin token
      security: []
      responses:
        "200":
          description: Wrapped token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /auth/getConfig:
