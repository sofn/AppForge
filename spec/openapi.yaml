          schema:
            type: integer
        - name: keyword
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Wrapped page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebEnvelopeArticlePage"
    post:
      tags: [web]
      summary: Create article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebArticleCreateRequest"
      responses:
        "200":
          description: Wrapped article id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebEnvelopeLong"
        "401":
          $ref: "#/components/responses/WebProblem"

  /web/user/articles:
    get:
      tags: [web]
      summary: Current user's articles
      parameters:
        - name: currentPage
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Wrapped page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebEnvelopeArticlePage"
        "401":
          $ref: "#/components/responses/WebProblem"

  /web/articles/{slug}:
    get:
      tags: [web]
      summary: Published article by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wrapped article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebEnvelopeArticleDetail"

  /web/file/upload:
    post:
      tags: [web]
      summary: Upload C-end file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Wrapped file payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebEnvelopeFileUpload"
        "401":
          $ref: "#/components/responses/WebProblem"

  /web/file/{fileId}:
    get:
      tags: [web]
      summary: Download C-end file
      security: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    saToken:
      type: http
      scheme: bearer
      description: "sa-token value. Header Authorization: Bearer <token>."

  responses:
    AdminOk:
      description: Admin envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminEnvelope"
    WebProblem:
      description: RFC 9457 Problem Detail (C-end errors)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    AdminEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 0 means success
        message:
          type: string
        data: {}

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        captchaCode:
          type: string
        captchaKey:
          type: string

    WebLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: integer
          description: Optional ArchForge error code property
    WebLoginResponse:
      type: object
      required: [userId, username, tokenName, accessToken]
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        tokenName:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        expires:
          type: string

    WebLogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string

    WebRefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    WebUserProfileResponse:
      type: object
      required: [userId, username]
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string

    WebChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword, confirmPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
        confirmPassword:
          type: string

    WebSendVerificationCodeRequest:
      type: object
      required: [email, purpose]
      properties:
        email:
          type: string
        purpose:
          type: string
          enum: [REGISTER, RESET_PASSWORD]

    WebRegisterRequest:
      type: object
      required: [email, password, confirmPassword, code]
      properties:
        email:
          type: string
        password:
          type: string
        confirmPassword:
          type: string
        code:
          type: string

    WebResetPasswordRequest:
      type: object
      required: [email, code, newPassword, confirmPassword]
      properties:
        email:
          type: string
        code:
          type: string
        newPassword:
          type: string
        confirmPassword:
          type: string

    WebForgotPasswordRequest:
      type: object
      required: [email, purpose]
      properties:
        email:
          type: string
        purpose:
          type: string
          enum: [RESET_PASSWORD]

    WebDashboardMetricsResponse:
      type: object
      required: [userTotal, onlineNow, todayLogin, todayOperation]
      properties:
        userTotal:
          type: integer
          format: int64
        onlineNow:
          type: integer
          format: int64
        todayLogin:
          type: integer
          format: int64
        todayOperation:
          type: integer
          format: int64

    WebNoticeResponse:
      type: object
      required: [id, title, createTime]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        noticeType:
          type: integer
        createTime:
          type: string

    WebOperationLogResponse:
      type: object
      required: [id, username, operatingTime]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        module:
          type: string
        summary:
          type: string
        operatingTime:
          type: string

    WebCategoryResponse:
      type: object
      required: [id, name, slug, sortOrder, articleCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        sortOrder:
          type: integer
        articleCount:
          type: integer
          format: int64

    WebArticleSummaryResponse:
      type: object
      required: [id, title, slug, summary, coverImageUrl, categoryName, publishTime]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        summary:
          type: string
        coverImageFileId:
          type:
            - integer
            - "null"
          format: int64
        coverImageUrl:
          type: string
        categoryName:
          type: string
        publishTime:
          type: string

    WebArticleDetailResponse:
      type: object
      required:
        - id
        - title
        - slug
        - summary
        - content
        - coverImageUrl
        - categoryId
        - categoryName
        - categorySlug
        - publishTime
        - createTime
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        summary:
          type: string
        content:
          type: string
        coverImageFileId:
          type:
            - integer
            - "null"
          format: int64
        coverImageUrl:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        categorySlug:
          type: string
        publishTime:
          type: string
        createTime:
          type: string

    WebArticleCreateRequest:
      type: object
      required: [categoryId, title, content]
      properties:
        categoryId:
          type: integer
          format: int64
        title:
          type: string
        summary:
          type: string
        content:
          type: string
        coverImageFileId:
          type:
            - integer
            - "null"
          format: int64

    WebFileUploadResponse:
      type: object
      required: [fileId, url, name]
      properties:
        fileId:
          type: integer
          format: int64
        url:
          type: string
        name:
          type: string

    WebArticlePage:
      type: object
      required: [list, total, pageSize, currentPage]
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/WebArticleSummaryResponse"
        total:
          type: integer
          format: int64
        pageSize:
          type: integer
        currentPage:
          type: integer

    WebEnvelopeBoolean:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              type: boolean

    WebEnvelopeLong:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              type: integer
              format: int64

    WebEnvelopeLogin:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WebLoginResponse"

    WebEnvelopeProfile:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WebUserProfileResponse"

    WebEnvelopeMetrics:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WebDashboardMetricsResponse"

    WebEnvelopeNoticeList:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WebNoticeResponse"

    WebEnvelopeOperationLogList:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WebOperationLogResponse"

    WebEnvelopeCategoryList:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WebCategoryResponse"

    WebEnvelopeArticlePage:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WebArticlePage"

    WebEnvelopeArticleDetail:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WebArticleDetailResponse"

    WebEnvelopeFileUpload:
      allOf:
        - $ref: "#/components/schemas/AdminEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WebFileUploadResponse"

