name: CI

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  contract-lint:
    name: Contract & Spec Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint spec/openapi.yaml --format stylish

      - name: Check MenuTypeEnum contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("spec/enums.yaml").read_text()
          assert "name: MENU" in text and "value: 1" in text
          assert "name: CATALOG" in text
          assert "name: BUTTON" not in text.split("MenuTypeEnum:",1)[1].split("frontend:",1)[0]
          for name in ("BlogArticleStatus", "NoticeTypeEnum", "NoticeStatusEnum", "GenderEnum", "OperationStatusEnum", "LoginStatusEnum"):
              assert name in text, name
          print("MenuTypeEnum contract ok")
          PY

      - name: Check live paths listed
        run: |
          grep -q "/admin/dashboard/metrics" docs/specs/api-path.md
          grep -q "/admin/chat/config" docs/specs/api-path.md
          grep -q "/web/user/articles" docs/specs/api-path.md
          grep -q "/web/user/articles" spec/openapi.yaml
          grep -q "CHAT_AI" docs/specs/error-codes.md
          grep -q "/admin/user/create" spec/openapi.yaml
          grep -q "/admin/menu/create" spec/openapi.yaml
          grep -q "/blog/article/create" spec/openapi.yaml
          echo paths ok

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchForge

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ArchForge
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Aggregate JaCoCo report
        if: always()
        run: ./gradlew jacocoAggregateReport --no-daemon -x test

      - name: Diff coverage report (PR comment)
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/ArchForge/build/reports/jacoco/jacocoAggregateReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 60
          title: ":chart_with_upwards_trend: Diff Coverage"
          update-comment: true

      - name: Diff coverage gate (new code < 60% fails)
        if: github.event_name == 'pull_request'
        run: |
          pipx install diff-cover
          git fetch origin "${{ github.base_ref }}" --depth=1
          diff-cover build/reports/jacoco/jacocoAggregateReport.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 60

      - name: Error-code registration check (contract sync)
        run: python3 scripts/check-error-codes.py docs/specs/error-codes.md

      - name: Export live OpenAPI document
        run: ./gradlew :archforge-server-admin:test --tests '*OpenApiSnapshotTest*' --no-daemon

      - name: Install oasdiff
        run: curl -sSf https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

      # Breaking-change gate: compare this build's live export against the
      # contract as it stands on the target branch. Using the *published*
      # contract as base (instead of the working copy) keeps the gate honest —
      # editing spec/openapi.yaml in the same PR can no longer hide a break.
      - name: Contract diff (breaking changes fail)
        run: |
          BASE_REF="${{ github.base_ref }}"
          BASE_REF="${BASE_REF:-main}"
          git fetch origin "$BASE_REF" --depth=1 || true
          if git cat-file -e "origin/${BASE_REF}:spec/openapi.yaml" 2>/dev/null; then
            git show "origin/${BASE_REF}:spec/openapi.yaml" > /tmp/base-openapi.yaml
            oasdiff breaking /tmp/base-openapi.yaml \
              archforge-server-admin/build/openapi/live-openapi.json \
              --format text
          else
            echo "::warning::no spec/openapi.yaml on origin/${BASE_REF} yet — skipping breaking-change diff"
          fi

      # Consistency gate: the committed contract must track the implementation.
      # ADVISORY during the migration grace period — the contract and the live
      # export are known to have drifted (coverage ~20%). Reconcile
      # spec/openapi.yaml against the live export, then drop continue-on-error
      # to make this a hard gate.
      - name: Contract vs implementation consistency (advisory)
        continue-on-error: true
        run: |
          oasdiff diff spec/openapi.yaml \
            archforge-server-admin/build/openapi/live-openapi.json \
            --format text --fail-on ERR

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-aggregate-report
          path: ArchForge/build/reports/jacoco/
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
